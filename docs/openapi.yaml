openapi: 3.0.0
info:
  title: Invoice Tracker + AI Agent Marketplace API
  description: |
    Comprehensive API for managing invoices, agents, and AI-powered shopping marketplace.
    Built with Go, integrated with AP2 protocol for agent discovery and A2A for agent communication.
  version: 1.0.0
  contact:
    name: API Support
    email: api@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.example.com/api/v1
    description: Production API
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: Capabilities
    description: Backend-authoritative runtime availability for the active business
  - name: Intent Processing
    description: Natural language intent parsing and product matching
  - name: Agent Discovery
    description: Agent registry and discovery endpoints
  - name: A2A Protocol
    description: Agent-to-agent communication
  - name: WebSocket
    description: Real-time bidirectional communication
  - name: Marketplace
    description: Product and order management
  - name: Payment
    description: Payment processing and credentials

paths:
  /capabilities:
    get:
      summary: List runtime capabilities
      description: |
        Returns the customer-safe runtime capability evaluation for the authenticated
        active business. Provider health comes from a tenant-isolated cache; this
        request never synchronously contacts providers.
      tags:
        - Capabilities
      security:
        - BearerAuth: []
      parameters:
        - name: platform
          in: query
          required: false
          schema:
            type: string
            enum: [web, ios, android]
            default: web
      responses:
        "200":
          description: Capability evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityList"
        "400":
          description: Invalid platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Active business scope required or denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Capability evaluation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityErrorResponse"
        "503":
          description: Capability service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityErrorResponse"

  /intent/process:
    post:
      summary: Process shopping intent
      description: |
        Parse natural language shopping intent and return matching products.
        Uses Claude or Gemini LLM for intent extraction, applies constraint validation.
      tags:
        - Intent Processing
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - intent
              properties:
                intent:
                  type: string
                  description: Natural language shopping intent
                  example: "I need a laptop under 50000 rupees with good battery"
                max_results:
                  type: integer
                  default: 20
                  description: Maximum number of products to return
      responses:
        "200":
          description: Intent processed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentProcessingResponse"
        "400":
          description: Invalid intent or no products found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error

  /intent/validate:
    post:
      summary: Validate intent against inventory
      description: Check if products exist for the given intent without detailed search
      tags:
        - Intent Processing
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - intent
              properties:
                intent:
                  type: string
                  example: "blue running shoes"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  confidence:
                    type: number
                  matched_products:
                    type: integer
                  error:
                    type: string

  /intent/parse:
    post:
      summary: Parse intent only
      description: Parse natural language intent without searching products
      tags:
        - Intent Processing
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - intent
              properties:
                intent:
                  type: string
      responses:
        "200":
          description: Parsed intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedIntent"

  /discovery/agents:
    get:
      summary: Search agents in registry
      tags:
        - Agent Discovery
      parameters:
        - name: query
          in: query
          schema:
            type: string
          description: Search query
        - name: type
          in: query
          schema:
            type: string
          description: Agent type (shopping, merchant, credential_provider, payment_processor)
        - name: capability
          in: query
          schema:
            type: string
          description: Required capability
        - name: jurisdiction
          in: query
          schema:
            type: string
          description: Jurisdiction filter
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSearchResponse"

  /.well-known/agent-card.json:
    get:
      summary: Get latest A2A agent card
      description: |
        Public latest-spec A2A discovery endpoint.
        Returns the HTTP+JSON agent card advertised by this backend.
      tags:
        - A2A Protocol
      responses:
        "200":
          description: Latest A2A agent card
          content:
            application/a2a+json:
              schema:
                type: object

  /api/v1/a2a/message:send:
    post:
      summary: Send A2A message
      description: |
        Latest A2A HTTP+JSON entrypoint for synchronous task/message execution.
        Requires `Authorization: Bearer <jwt>` and `A2A-Version: 1.0`.
      tags:
        - A2A Protocol
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/a2a+json:
            schema:
              type: object
      responses:
        "200":
          description: Task or message response
          content:
            application/a2a+json:
              schema:
                type: object
        "400":
          description: Invalid request or unsupported version
          content:
            application/problem+json:
              schema:
                type: object
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                type: object

  /api/v1/a2a/message:stream:
    post:
      summary: Stream A2A execution
      description: |
        Latest A2A HTTP+JSON streaming entrypoint.
        Emits server-sent events for task snapshots, status updates, messages, and artifacts.
      tags:
        - A2A Protocol
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/a2a+json:
            schema:
              type: object
      responses:
        "200":
          description: SSE stream of A2A events
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/a2a/tasks:
    get:
      summary: List A2A tasks
      description: |
        Lists scoped A2A tasks with opaque pagination via `pageToken`.
      tags:
        - A2A Protocol
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Paginated tasks
          content:
            application/a2a+json:
              schema:
                type: object

  /api/v1/a2a/tasks/{taskId}:
    get:
      summary: Get A2A task
      tags:
        - A2A Protocol
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task snapshot
          content:
            application/a2a+json:
              schema:
                type: object

  /api/v1/a2a/tasks/{taskId}:cancel:
    post:
      summary: Cancel A2A task
      tags:
        - A2A Protocol
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled task snapshot
          content:
            application/a2a+json:
              schema:
                type: object

  /api/v1/a2a/tasks/{taskId}/subscribe:
    get:
      summary: Subscribe to A2A task events
      tags:
        - A2A Protocol
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE subscription stream
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/a2a/tasks/{taskId}/pushNotificationConfigs:
    get:
      summary: List task push notification configs
      tags:
        - A2A Protocol
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task push notification configs
          content:
            application/a2a+json:
              schema:
                type: object
    post:
      summary: Create task push notification config
      tags:
        - A2A Protocol
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/a2a+json:
            schema:
              type: object
      responses:
        "200":
          description: Created task push notification config
          content:
            application/a2a+json:
              schema:
                type: object

  /api/v1/a2a/tasks/{taskId}/pushNotificationConfigs/{configId}:
    get:
      summary: Get task push notification config
      tags:
        - A2A Protocol
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - name: configId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task push notification config
          content:
            application/a2a+json:
              schema:
                type: object
    delete:
      summary: Delete task push notification config
      tags:
        - A2A Protocol
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - name: configId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /ws:
    get:
      summary: WebSocket connection
      description: |
        Upgrade HTTP to WebSocket for real-time communication.
        Send and receive order updates, payment notifications, agent actions.
      tags:
        - WebSocket
      security:
        - BearerAuth: []
      responses:
        "101":
          description: Switching Protocols
        "401":
          description: Unauthorized
        "503":
          description: WebSocket service unavailable

  /ws/stats:
    get:
      summary: WebSocket statistics
      tags:
        - WebSocket
      security:
        - BearerAuth: []
      responses:
        "200":
          description: WebSocket stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected_clients:
                    type: integer
                  connected_users:
                    type: array
                    items:
                      type: string

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from authentication endpoint

  schemas:
    CapabilityList:
      type: object
      required: [business_id, platform, evaluated_at, capabilities]
      properties:
        business_id:
          type: string
        platform:
          type: string
          enum: [web, ios, android]
        evaluated_at:
          type: string
          format: date-time
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeCapability"

    RuntimeCapability:
      type: object
      required:
        - key
        - product_support
        - configuration
        - provider_health
        - entitlement
        - quota
        - permission
        - business_setup
        - platform
        - available
        - state
        - reason_code
        - evaluated_at
      properties:
        key:
          type: string
          enum: [razorpay_payments, gst_provider, e_invoice, e_way_bill, whatsapp_messaging, email_delivery, s3_uploads, voice, ai, storefront_payments, report_exports, bulk_imports, saved_payment_methods]
        product_support:
          type: object
          required: [supported]
          properties:
            supported:
              type: boolean
        configuration:
          type: object
          required: [required, configured]
          properties:
            required:
              type: boolean
            configured:
              type: boolean
        provider_health:
          type: object
          required: [status, stale]
          properties:
            status:
              type: string
              enum: [unknown, healthy, degraded, unavailable]
            observed_at:
              type: string
              format: date-time
            stale:
              type: boolean
        entitlement:
          type: object
          required: [required, entitled]
          properties:
            required:
              type: boolean
            entitled:
              type: boolean
        quota:
          type: object
          required: [limited, limit, used, remaining, available]
          properties:
            limited:
              type: boolean
            limit:
              type: integer
              format: int64
            used:
              type: integer
              format: int64
            remaining:
              type: integer
              format: int64
            available:
              type: boolean
        permission:
          type: object
          required: [required, granted]
          properties:
            required:
              type: boolean
            key:
              type: string
            granted:
              type: boolean
        business_setup:
          type: object
          required: [required, complete]
          properties:
            required:
              type: boolean
            complete:
              type: boolean
        platform:
          type: object
          required: [requested, supported, supported_platforms]
          properties:
            requested:
              type: string
              enum: [web, ios, android]
            supported:
              type: boolean
            supported_platforms:
              type: array
              items:
                type: string
                enum: [web, ios, android]
        available:
          type: boolean
        state:
          type: string
          enum: [available, setup_required, upgrade_required, quota_exhausted, permission_denied, temporarily_unavailable, unsupported_platform, unsupported, unknown]
        reason_code:
          type: string
        setup_action:
          type: string
        retry_at:
          type: string
          format: date-time
        degradation:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        evaluated_at:
          type: string
          format: date-time

    CapabilityErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_platform, authentication_required, business_scope_required, capability_service_unavailable, capability_evaluation_failed]
            message:
              type: string

    ParsedIntent:
      type: object
      properties:
        intent:
          type: object
          properties:
            categories:
              type: array
              items:
                type: string
            keywords:
              type: array
              items:
                type: string
            price_range:
              type: object
              properties:
                min:
                  type: number
                max:
                  type: number
                currency:
                  type: string
            urgency:
              type: string
              enum: [low, medium, high, urgent]
            quantity:
              type: integer
        confidence:
          type: number
          description: Confidence score 0-100
        parsed:
          type: boolean

    IntentProcessingResponse:
      type: object
      properties:
        parse_result:
          $ref: "#/components/schemas/ParsedIntent"
        match_results:
          type: object
          properties:
            total_matched:
              type: integer
            total_searched:
              type: integer
            products:
              type: array
              items:
                $ref: "#/components/schemas/MatchedProduct"

    MatchedProduct:
      type: object
      properties:
        product:
          $ref: "#/components/schemas/Product"
        relevance_score:
          type: number
          description: Score 0-100
        match_reasons:
          type: array
          items:
            type: string

    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        currency:
          type: string
          example: INR
        category:
          type: string
        rating:
          type: number
          format: double
          minimum: 0
          maximum: 5
        review_count:
          type: integer
        is_available:
          type: boolean
        inventory_count:
          type: integer

    AgentCard:
      type: object
      description: AP2 Agent Card format
      properties:
        name:
          type: string
        description:
          type: string
        endpoint:
          type: string
          format: uri
        type:
          type: string
        capabilities:
          type: array
          items:
            type: string
        pricing_model:
          type: object
        currencies:
          type: array
          items:
            type: string
        jurisdictions:
          type: array
          items:
            type: string
        public_key:
          type: string
        version:
          type: string

    AgentSearchResponse:
      type: object
      properties:
        agents:
          type: array
          items:
            type: object
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    A2AMessage:
      type: object
      properties:
        version:
          type: string
          default: "1.0"
        message_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        sender_id:
          type: string
        receiver_id:
          type: string
        message_type:
          type: string
          enum:
            - task.start
            - task.data
            - task.status
            - task.result
            - task.error
            - task.cancel
            - negotiate.start
            - negotiate.accept
            - negotiate.reject
            - query.capabilities
            - response.capabilities
        payload:
          type: object
        timestamp:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        signature:
          type: string
          description: ECDSA P-256 signature in base64

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        errors:
          type: array
          items:
            type: string
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string
          format: uuid
