  ProductionDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-github-actions-production-role"
      Description: Approval-gated GitHub OIDC role for Billeif production deployments
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: GitHubProductionEnvironment
            Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": repo:cyfernova/Billeif-Backend:environment:production
                "token.actions.githubusercontent.com:repository_id": "1122461982"
                "token.actions.githubusercontent.com:repository_owner_id": "236051948"
                "token.actions.githubusercontent.com:workflow": Terraform Deploy
                "token.actions.githubusercontent.com:ref": refs/heads/main
      ManagedPolicyArns:
        - !Ref CoreInfrastructureDeploymentPolicy
        - !Ref ServiceInfrastructureDeploymentPolicy
      Policies:
        - PolicyName: !Sub "${ProjectName}-${Environment}-application-deployment"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageDatabaseHostParameter
                Effect: Allow
                Action:
                  - ssm:DeleteParameter
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:ListTagsForResource
                  - ssm:PutParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${Environment}/db/host"
              - Sid: ManageTerraformStateBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::${TerraformStateBucketName}"
              - Sid: ManageTerraformStateObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${TerraformStateBucketName}/*"
              - Sid: ManageTerraformStateLock
                Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TerraformStateLockTableName}"
              - Sid: ManageLambdaArtifacts
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ProjectName}-${Environment}-${AWS::AccountId}-lambda-artifacts/lambda/*"
              - Sid: InvokeDatabaseMigrator
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-${Environment}-database-migrator"
              - Sid: ReadBilleifIAM
                Effect: Allow
                Action:
                  - iam:GetInstanceProfile
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfileTags
                  - iam:ListInstanceProfilesForRole
                  - iam:ListRolePolicies
                  - iam:ListRoleTags
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/${ProjectName}-${Environment}-*"
              - Sid: ReadGitHubOIDCProvider
                Effect: Allow
                Action:
                  - iam:GetOpenIDConnectProvider
                  - iam:ListOpenIDConnectProviderTags
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
              - Sid: ListIAMMetadata
                Effect: Allow
                Action:
                  - iam:ListOpenIDConnectProviders
                  - iam:ListRoles
                Resource: "*"
              - Sid: PassLambdaRolesToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-cognito-phone-custom-sms-role"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-database-migrator-exec-role"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-email-delivery-exec-role"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-lambda-bargaining-worker-exec-role"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-lambda-exec-role"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-lambda-gst-worker-exec-role"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-lambda-http-exec-role"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-lambda-invoice-worker-exec-role"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-lambda-websocket-exec-role"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-outbox-dispatcher-exec-role"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-ses-feedback-exec-role"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-voice-reconciler-role"
                Condition:
                  StringEquals:
                    "iam:PassedToService": lambda.amazonaws.com
              - Sid: PassEC2RolesToEC2
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-nat-instance-role"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-rds-tunnel-role"
                Condition:
                  StringEquals:
                    "iam:PassedToService": ec2.amazonaws.com
              - Sid: PassAgentCoreRoleToAgentCore
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-voice-agentcore-runtime-role"
                Condition:
                  StringEquals:
                    "iam:PassedToService": bedrock-agentcore.amazonaws.com
              - Sid: PassSchedulerRolesToScheduler
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-outbox-scheduler-exec-role"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-voice-reconciler-scheduler-role"
                Condition:
                  StringEquals:
                    "iam:PassedToService": scheduler.amazonaws.com
              - Sid: PassAPIGatewayRoleToAPIGateway
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-apigateway-cloudwatch-role"
                Condition:
                  StringEquals:
                    "iam:PassedToService": apigateway.amazonaws.com
              - Sid: PassCognitoRoleToCognito
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-cognito-phone-sms-role"
                Condition:
                  StringEquals:
                    "iam:PassedToService": cognito-idp.amazonaws.com
              - Sid: PassRDSRoleToRDS
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-rds-proxy-role"
                Condition:
                  StringEquals:
                    "iam:PassedToService": rds.amazonaws.com
              - Sid: DenyWorkloadIAMMutation
                Effect: Deny
                Action:
                  - iam:AddRoleToInstanceProfile
                  - iam:AttachRolePolicy
                  - iam:CreateInstanceProfile
                  - iam:CreateRole
                  - iam:DeleteInstanceProfile
                  - iam:DeleteRole
                  - iam:DeleteRolePermissionsBoundary
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePermissionsBoundary
                  - iam:PutRolePolicy
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:TagInstanceProfile
                  - iam:TagRole
                  - iam:UntagInstanceProfile
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:UpdateRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/${ProjectName}-${Environment}-*"
              - Sid: DenyResourcePolicyDelegation
                Effect: Deny
                Action:
                  - kms:PutKeyPolicy
                  - s3:DeleteBucketPolicy
                  - s3:PutBucketPolicy
                  - secretsmanager:DeleteResourcePolicy
                  - secretsmanager:PutResourcePolicy
                  - sns:SetTopicAttributes
                  - sqs:SetQueueAttributes
                Resource: "*"
              - Sid: DenyDeploymentRoleSelfMutation
                Effect: Deny
                Action: iam:*
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-github-actions-production-role"
              - Sid: DenyBoundaryMutation
                Effect: Deny
                Action: iam:*
                Resource: !Ref WorkloadPermissionsBoundary
              - Sid: DenyBoundaryRemoval
                Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-*"

Outputs:
  DeploymentRoleArn:
    Description: Store as the production environment AWS_DEPLOY_ROLE_ARN secret
    Value: !GetAtt ProductionDeploymentRole.Arn
  WorkloadPermissionsBoundaryArn:
    Description: Permission ceiling applied to every Terraform-managed workload role
    Value: !Ref WorkloadPermissionsBoundary
