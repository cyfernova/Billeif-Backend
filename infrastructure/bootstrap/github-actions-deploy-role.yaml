AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One-time security bootstrap for Billeif production deployments. This stack is
  deliberately administered outside the application Terraform state so the
  GitHub deployment role cannot change its own trust or permission ceiling.

Parameters:
  ProjectName:
    Type: String
    Default: billeif
    AllowedPattern: "[a-z0-9-]+"
  Environment:
    Type: String
    Default: dev
    AllowedPattern: "[a-z0-9-]+"
  TerraformStateBucketName:
    Type: String
    Description: Existing S3 bucket used exclusively for Terraform state
  TerraformStateLockTableName:
    Type: String
    Description: Existing DynamoDB table used exclusively for Terraform state locking

Resources:
  WorkloadPermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-${Environment}-workload-boundary"
      Description: Maximum permissions for Billeif application workload roles
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowRequiredWorkloadActions
            Effect: Allow
            Action:
              - bedrock-agentcore:GetWorkloadAccessTokenForUserId
              - bedrock-agentcore:StopRuntimeSession
              - cloudwatch:PutMetricData
              - cognito-idp:AdminConfirmSignUp
              - cognito-idp:AdminCreateUser
              - cognito-idp:AdminDeleteUser
              - cognito-idp:ChangePassword
              - cognito-idp:ConfirmForgotPassword
              - cognito-idp:ConfirmSignUp
              - cognito-idp:ForgotPassword
              - cognito-idp:GlobalSignOut
              - cognito-idp:InitiateAuth
              - cognito-idp:ListUsers
              - cognito-idp:ResendConfirmationCode
              - cognito-idp:SignUp
              - dynamodb:DeleteItem
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:TransactWriteItems
              - dynamodb:UpdateItem
              - ec2:AssignPrivateIpAddresses
              - ec2:CreateNetworkInterface
              - ec2:DeleteNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSubnets
              - ec2:UnassignPrivateIpAddresses
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:GetAuthorizationToken
              - ecr:GetDownloadUrlForLayer
              - elasticache:Connect
              - execute-api:ManageConnections
              - kinesisvideo:DescribeSignalingChannel
              - kinesisvideo:GetIceServerConfig
              - kinesisvideo:GetSignalingChannelEndpoint
              - kms:Decrypt
              - kms:DescribeKey
              - lambda:InvokeFunction
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
              - logs:PutLogEvents
              - logs:PutMetricFilter
              - logs:PutRetentionPolicy
              - s3:DeleteObject
              - s3:GetObject
              - s3:ListBucket
              - s3:PutObject
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
              - ses:SendEmail
              - ses:SendRawEmail
              - sns:Publish
              - sqs:ChangeMessageVisibility
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:ReceiveMessage
              - sqs:SendMessage
              - ssm:GetParameters
            Resource: "*"
          - Sid: DenyIdentityAndOrganizationAdministration
            Effect: Deny
            Action:
              - account:*
              - iam:*
              - identitystore:*
              - organizations:*
              - sso:*
              - sso-directory:*
              - sts:AssumeRole
              - sts:AssumeRoleWithSAML
              - sts:AssumeRoleWithWebIdentity
              - sts:GetFederationToken
            Resource: "*"

