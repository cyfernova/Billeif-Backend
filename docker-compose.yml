services:
  postgres:
    image: postgres:16-alpine
    container_name: invoice-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=invoice_user
      - POSTGRES_PASSWORD=invoice_pass
      - POSTGRES_DB=invoice_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - invoice-network

  redis:
    image: redis:7-alpine
    container_name: invoice-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - invoice-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice-app
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - ENVIRONMENT=dev
      - SERVER_PORT=8080
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=invoice_user
      - DATABASE_PASSWORD=invoice_pass
      - DATABASE_NAME=invoice_db
      - DATABASE_SSL_MODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AWS_REGION=us-east-1
      # For local dev, use local postgres/redis
      # For AWS, set these from terraform outputs or SSM
      # - DATABASE_HOST=${RDS_ENDPOINT}
      # - REDIS_HOST=${ELASTICACHE_ENDPOINT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./migrations:/app/migrations
    networks:
      - invoice-network

  adminer:
    image: adminer:latest
    container_name: invoice-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - invoice-network

networks:
  invoice-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
