name: Terraform Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync-provider-secrets:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Configure existing deployment identity
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: ai-secret-sync-${{ github.run_id }}
      - name: Store existing AI provider credentials
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AWS_PROFILE: default
          AWS_DEFAULT_PROFILE: default
        shell: python
        run: |
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          import uuid

          values = {name: os.environ.pop(name, '').strip() for name in ('LLM_API_KEY', 'DEEPSEEK_API_KEY')}
          if any(not value for value in values.values()):
              sys.exit('A required GitHub AI provider secret is empty.')
          with tempfile.TemporaryDirectory() as directory:
              credentials_path = os.path.join(directory, 'credentials')
              private = lambda path, flags: os.open(path, flags, 0o600)
              with open(credentials_path, 'w', opener=private) as credentials:
                  credentials.write('[default]\n')
                  for setting, variable in [('aws_access_key_id', 'AWS_ACCESS_KEY_ID'), ('aws_secret_access_key', 'AWS_SECRET_ACCESS_KEY'), ('aws_session_token', 'AWS_SESSION_TOKEN')]:
                      credentials.write(setting + '=' + os.environ[variable] + '\n')
              child_env = dict(os.environ, AWS_SHARED_CREDENTIALS_FILE=credentials_path)
              for name, secret_id in [('LLM_API_KEY', '/billeif/dev/providers/llm'), ('DEEPSEEK_API_KEY', '/billeif/dev/providers/deepseek')]:
                  secret_path = os.path.join(directory, name + '.json')
                  with open(secret_path, 'w', opener=private) as secret_file:
                      json.dump({'api_key': values.pop(name)}, secret_file)
                  result = subprocess.run(
                      ['aws', 'secretsmanager', 'put-secret-value', '--region', 'ap-south-1', '--profile', 'default',
                       '--secret-id', secret_id, '--secret-string', 'file://' + secret_path,
                       '--client-request-token', str(uuid.uuid4()), '--version-stages', 'AWSCURRENT', '--output', 'json'],
                      text=True, capture_output=True, check=False, env=child_env,
                  )
                  if result.returncode:
                      code = re.search(r'An error occurred \(([A-Za-z0-9]+)\)', result.stderr)
                      sys.exit(name + ' transfer failed: ' + (code.group(1) if code else 'CLI configuration error'))
                  if 'AWSCURRENT' not in json.loads(result.stdout).get('VersionStages', []):
                      sys.exit(name + ' was not stored as the current version.')
                  os.remove(secret_path)
                  print(name + ' stored as AWSCURRENT; value omitted.')
