name: Terraform Deploy

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      sync_exa_secret:
        description: Store the existing GitHub Exa key in AWS Secrets Manager
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TERRAFORM_DIR: infrastructure/terraform
  AWS_REGION: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'ap-south-1' }}
  TF_BACKEND_KEY: ${{ vars.TF_STATE_KEY != '' && vars.TF_STATE_KEY || 'billeif/dev/terraform.tfstate' }}

jobs:
  secret-scan:
    name: Scan Introduced Commits For Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan commits introduced by this event
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks-${GITLEAKS_VERSION}"

          curl --fail --silent --show-error --location \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive}" | sha256sum --check
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" -C "${install_dir}" gitleaks
          export PATH="${install_dir}:${PATH}"

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              scan_range="origin/${GITHUB_BASE_REF}..HEAD"
              ;;
            push)
              before="${{ github.event.before }}"
              if [ -n "${before}" ] && [ "${before}" != "0000000000000000000000000000000000000000" ]; then
                scan_range="${before}..${GITHUB_SHA}"
              else
                scan_range="${GITHUB_SHA}^..${GITHUB_SHA}"
              fi
              ;;
            *)
              scan_range="${GITHUB_SHA}^..${GITHUB_SHA}"
              ;;
          esac

          gitleaks detect \
            --source . \
            --log-opts="${scan_range}" \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1

  verify:
    name: Verify Build And Terraform
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.29.3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false

      - name: Initialize Terraform without backend
        run: terraform -chdir="${TERRAFORM_DIR}" init -backend=false -input=false

      - name: Run Go tests
        run: go test ./...

      - name: Test AgentCore runtime contract
        run: make test-agentcore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build AgentCore ARM64 binary
        run: make build-agentcore

      - name: Build AgentCore ARM64 image without publishing
        run: |
          docker buildx build --platform linux/arm64 \
            --file deploy/agentcore/Dockerfile \
            --tag billeif-voice-runtime:ci \
            --load .
          test "$(docker inspect billeif-voice-runtime:ci --format '{{.Os}}/{{.Architecture}} {{.Config.User}}')" = "linux/arm64 10001:10001"
          docker pull --platform linux/arm64 curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
          docker network create --internal billeif-voice-offline-ci
          trap 'docker rm --force billeif-voice-runtime-ci >/dev/null 2>&1 || true; docker network rm billeif-voice-offline-ci >/dev/null 2>&1 || true' EXIT
          docker run --detach --name billeif-voice-runtime-ci \
            --platform linux/arm64 \
            --network billeif-voice-offline-ci \
            --env AWS_ACCESS_KEY_ID=ci-offline \
            --env AWS_SECRET_ACCESS_KEY=ci-offline-secret \
            --env AWS_EC2_METADATA_DISABLED=true \
            --env AWS_REGION=ap-south-1 \
            --env ENVIRONMENT=test \
            --env BILLEIF_API_ORIGIN=https://api123.execute-api.ap-south-1.amazonaws.com/test \
            --env COGNITO_PHONE_CLIENT_ID=ci-phone-client \
            --env COGNITO_PHONE_REGION=ap-south-1 \
            --env COGNITO_PHONE_USER_POOL_ID=ap-south-1_ciphone \
            --env RUNTIME_ID=ci_voice_runtime \
            --env SARVAM_SECRET_ARN=arn:aws:secretsmanager:ap-south-1:123456789012:secret:ci-sarvam \
            --env VOICE_GLOBAL_CAPACITY_LIMIT=100 \
            --env VOICE_KVS_CHANNEL_ARNS=arn:aws:kinesisvideo:ap-south-1:123456789012:channel/voice-a/1234567890,arn:aws:kinesisvideo:ap-south-1:123456789012:channel/voice-b/1234567890,arn:aws:kinesisvideo:ap-south-1:123456789012:channel/voice-c/1234567890,arn:aws:kinesisvideo:ap-south-1:123456789012:channel/voice-d/1234567890,arn:aws:kinesisvideo:ap-south-1:123456789012:channel/voice-e/1234567890,arn:aws:kinesisvideo:ap-south-1:123456789012:channel/voice-f/1234567890,arn:aws:kinesisvideo:ap-south-1:123456789012:channel/voice-g/1234567890,arn:aws:kinesisvideo:ap-south-1:123456789012:channel/voice-h/1234567890,arn:aws:kinesisvideo:ap-south-1:123456789012:channel/voice-i/1234567890,arn:aws:kinesisvideo:ap-south-1:123456789012:channel/voice-j/1234567890,arn:aws:kinesisvideo:ap-south-1:123456789012:channel/voice-k/1234567890,arn:aws:kinesisvideo:ap-south-1:123456789012:channel/voice-l/1234567890 \
            --env VOICE_KVS_CHANNEL_COUNT=12 \
            --env VOICE_PER_USER_CAPACITY_LIMIT=1 \
            --env VOICE_PROTOCOL_VERSION=1 \
            --env VOICE_SESSION_LEASE_DURATION=2m \
            --env VOICE_SESSION_MAX_DURATION=55m \
            --env VOICE_SESSION_ROTATE_AFTER=52m \
            --env VOICE_SESSIONS_TABLE_NAME=billeif-ci-voice-sessions \
            billeif-voice-runtime:ci
          for attempt in $(seq 1 30); do
            response="$(docker run --rm --platform linux/arm64 \
              --network billeif-voice-offline-ci \
              curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6 \
              --silent --fail http://billeif-voice-runtime-ci:8080/ping || true)"
            if test "${response}" = '{"status":"Healthy"}'; then
              exit 0
            fi
            sleep 1
          done
          docker logs billeif-voice-runtime-ci
          exit 1

      - name: Build Lambda artifacts
        run: make package-lambda

      - name: Check Terraform formatting
        run: terraform -chdir="${TERRAFORM_DIR}" fmt -check -recursive

      - name: Validate Terraform
        run: terraform -chdir="${TERRAFORM_DIR}" validate

      - name: Run Terraform tests
        run: terraform -chdir="${TERRAFORM_DIR}" test

  deploy:
    name: Apply Terraform
    runs-on: ubuntu-latest
    environment: production
    needs:
      - secret-scan
      - verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL != '' && vars.ALERT_EMAIL || 'anjishnu@cyfernova.in' }}
      TF_VAR_alert_email_subscription_confirmed: ${{ vars.ALERT_EMAIL_SUBSCRIPTION_CONFIRMED == 'true' && 'true' || 'false' }}
      TF_VAR_db_allowed_cidr: "127.0.0.1/32"
      TF_VAR_enable_application: ${{ vars.ENABLE_APPLICATION == 'true' && 'true' || 'false' }}
      TF_VAR_enable_cognito_custom_domain_provisioning: ${{ vars.ENABLE_COGNITO_CUSTOM_DOMAIN_PROVISIONING == 'true' && 'true' || 'false' }}
      TF_VAR_enable_cognito_custom_domain_cutover: ${{ vars.ENABLE_COGNITO_CUSTOM_DOMAIN_CUTOVER == 'true' && 'true' || 'false' }}
      TF_VAR_enable_background_processing: ${{ vars.ENABLE_BACKGROUND_PROCESSING == 'true' && 'true' || 'false' }}
      TF_VAR_provision_voice_infrastructure: ${{ vars.PROVISION_VOICE_INFRASTRUCTURE == 'true' && 'true' || 'false' }}
      TF_VAR_provision_voice_agentcore_runtime: ${{ vars.PROVISION_VOICE_AGENTCORE_RUNTIME == 'true' && 'true' || 'false' }}
      TF_VAR_promote_voice_agentcore_prod: ${{ vars.PROMOTE_VOICE_AGENTCORE_PROD == 'true' && 'true' || 'false' }}
      PUBLISH_VOICE_AGENTCORE_IMAGE: ${{ vars.PUBLISH_VOICE_AGENTCORE_IMAGE == 'true' && 'true' || 'false' }}
      # Terraform permits STAGING admission only outside prod. Production still
      # requires the immutable PROD endpoint and every evidence gate below.
      TF_VAR_enable_voice: ${{ vars.PROVISION_VOICE_AGENTCORE_RUNTIME == 'true' && vars.ENABLE_VOICE == 'true' && 'true' || 'false' }}
      TF_VAR_enable_voice_turn_udp_egress: ${{ vars.ENABLE_VOICE_TURN_UDP_EGRESS == 'true' && 'true' || 'false' }}
      TF_VAR_voice_agentcore_image_tag: ${{ vars.VOICE_AGENTCORE_IMAGE_TAG != '' && vars.VOICE_AGENTCORE_IMAGE_TAG || '' }}
      TF_VAR_voice_agentcore_image_digest: ${{ vars.VOICE_AGENTCORE_IMAGE_DIGEST != '' && vars.VOICE_AGENTCORE_IMAGE_DIGEST || '' }}
      TF_VAR_voice_agentcore_release: ${{ vars.VOICE_AGENTCORE_RELEASE != '' && vars.VOICE_AGENTCORE_RELEASE || '' }}
      TF_VAR_voice_agentcore_prod_version: ${{ vars.VOICE_AGENTCORE_PROD_VERSION != '' && vars.VOICE_AGENTCORE_PROD_VERSION || '' }}
      TF_VAR_voice_agentcore_previous_prod_version: ${{ vars.VOICE_AGENTCORE_PREVIOUS_PROD_VERSION != '' && vars.VOICE_AGENTCORE_PREVIOUS_PROD_VERSION || '' }}
      TF_VAR_voice_rollout_stage: ${{ vars.VOICE_ROLLOUT_STAGE != '' && vars.VOICE_ROLLOUT_STAGE || 'disabled' }}
      TF_VAR_voice_rollout_internal_sub_hashes: ${{ vars.VOICE_ROLLOUT_INTERNAL_SUB_HASHES != '' && vars.VOICE_ROLLOUT_INTERNAL_SUB_HASHES || '[]' }}
      TF_VAR_voice_sarvam_stt_concurrency_150_acknowledged: ${{ vars.VOICE_SARVAM_STT_CONCURRENCY_150_ACKNOWLEDGED == 'true' && 'true' || 'false' }}
      TF_VAR_voice_bulbul_concurrency_150_acknowledged: ${{ vars.VOICE_BULBUL_CONCURRENCY_150_ACKNOWLEDGED == 'true' && 'true' || 'false' }}
      TF_VAR_voice_sarvam_llm_rpm_300_acknowledged: ${{ vars.VOICE_SARVAM_LLM_RPM_300_ACKNOWLEDGED == 'true' && 'true' || 'false' }}
      TF_VAR_voice_agentcore_kvs_sessions_120_acknowledged: ${{ vars.VOICE_AGENTCORE_KVS_SESSIONS_120_ACKNOWLEDGED == 'true' && 'true' || 'false' }}
      TF_VAR_voice_turn_live_proof_acknowledged: ${{ vars.VOICE_TURN_LIVE_PROOF_ACKNOWLEDGED == 'true' && 'true' || 'false' }}
      TF_VAR_voice_load_cost_live_evidence_acknowledged: ${{ vars.VOICE_LOAD_COST_LIVE_EVIDENCE_ACKNOWLEDGED == 'true' && 'true' || 'false' }}
      TF_VAR_voice_staging_verified: ${{ vars.VOICE_STAGING_VERIFIED == 'true' && 'true' || 'false' }}
      TF_VAR_voice_staging_verified_image_digest: ${{ vars.VOICE_STAGING_VERIFIED_IMAGE_DIGEST != '' && vars.VOICE_STAGING_VERIFIED_IMAGE_DIGEST || '' }}
      TF_VAR_voice_staging_verified_release: ${{ vars.VOICE_STAGING_VERIFIED_RELEASE != '' && vars.VOICE_STAGING_VERIFIED_RELEASE || '' }}
      TF_VAR_voice_staging_verified_version: ${{ vars.VOICE_STAGING_VERIFIED_VERSION != '' && vars.VOICE_STAGING_VERIFIED_VERSION || '' }}
      TF_VAR_voice_generic_websocket_verified: ${{ vars.VOICE_GENERIC_WEBSOCKET_VERIFIED == 'true' && 'true' || 'false' }}
      TF_VAR_enable_rds_tunnel: "false"
      TF_VAR_use_ambient_aws_credentials: "true"
      TF_VAR_llm_api_url: ${{ vars.LLM_API_URL != '' && vars.LLM_API_URL || 'https://api.deepseek.com/chat/completions' }}
      TF_VAR_llm_model: ${{ vars.LLM_MODEL != '' && vars.LLM_MODEL || 'deepseek-flash' }}
      TF_VAR_deepseek_base_url: ${{ vars.DEEPSEEK_BASE_URL != '' && vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
      TF_VAR_deepseek_model: ${{ vars.DEEPSEEK_MODEL != '' && vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
      TF_VAR_ses_verified_identity: ${{ vars.SES_VERIFIED_IDENTITY != '' && vars.SES_VERIFIED_IDENTITY || 'anjishnu@cyfernova.in' }}
      TF_VAR_ses_sender_email: ${{ vars.SES_SENDER_EMAIL != '' && vars.SES_SENDER_EMAIL || 'anjishnu@cyfernova.in' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.29.3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false

      - name: Check deployment configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
        run: |
          require() {
            if [ -z "$2" ]; then
              echo "::error::$1"
              exit 1
            fi
          }

          require "Missing AWS_DEPLOY_ROLE_ARN secret." "${AWS_DEPLOY_ROLE_ARN}"
          require "Missing TF_STATE_BUCKET secret." "${TF_STATE_BUCKET}"
          require "Missing TF_STATE_LOCK_TABLE secret." "${TF_STATE_LOCK_TABLE}"
          if [ "${PUBLISH_VOICE_AGENTCORE_IMAGE}" = "true" ] && [ "${TF_VAR_provision_voice_infrastructure}" != "true" ]; then
            echo "::error::PUBLISH_VOICE_AGENTCORE_IMAGE requires PROVISION_VOICE_INFRASTRUCTURE=true."
            exit 1
          fi
          if [ "${TF_VAR_provision_voice_agentcore_runtime}" = "true" ] && [ "${TF_VAR_provision_voice_infrastructure}" != "true" ]; then
            echo "::error::PROVISION_VOICE_AGENTCORE_RUNTIME requires PROVISION_VOICE_INFRASTRUCTURE=true."
            exit 1
          fi
          if [ "${TF_VAR_promote_voice_agentcore_prod}" = "true" ] && [ "${TF_VAR_provision_voice_agentcore_runtime}" != "true" ]; then
            echo "::error::PROMOTE_VOICE_AGENTCORE_PROD requires PROVISION_VOICE_AGENTCORE_RUNTIME=true."
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-${{ github.run_id }}

      - name: Store existing Exa API key
        if: github.event_name == 'workflow_dispatch' && inputs.sync_exa_secret
        env:
          EXA_API_KEY: ${{ secrets.TF_VAR_EXA_API_KEY }}
          AWS_PROFILE: default
          AWS_DEFAULT_PROFILE: default
        shell: python
        run: |
          import configparser
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile

          api_key = os.environ.pop('EXA_API_KEY', '').strip()
          if not api_key:
              sys.exit('The Exa API key is missing or empty.')
          subprocess.run(
              ['aws', 'configure', 'set', 'region', 'ap-south-1', '--profile', 'default'],
              check=True, capture_output=True,
          )
          payload = json.dumps({
              'SecretId': '/billeif/dev/providers/exa',
              'SecretString': json.dumps({'api_key': api_key}),
          })
          credentials = configparser.ConfigParser(interpolation=None)
          credentials['default'] = {
              'aws_access_key_id': os.environ['AWS_ACCESS_KEY_ID'],
              'aws_secret_access_key': os.environ['AWS_SECRET_ACCESS_KEY'],
              'aws_session_token': os.environ['AWS_SESSION_TOKEN'],
          }
          with tempfile.NamedTemporaryFile(mode='w+', encoding='utf-8') as payload_file, \
                  tempfile.NamedTemporaryFile(mode='w+', encoding='utf-8') as credentials_file:
              payload_file.write(payload)
              payload_file.flush()
              credentials.write(credentials_file)
              credentials_file.flush()
              command_env = dict(os.environ, AWS_SHARED_CREDENTIALS_FILE=credentials_file.name)
              result = subprocess.run(
                  ['aws', 'secretsmanager', 'put-secret-value', '--profile', 'default',
                   '--region', 'ap-south-1', '--cli-input-json', 'file://' + payload_file.name,
                   '--output', 'json'],
                  env=command_env, text=True, capture_output=True, check=False,
              )
          if result.returncode:
              error_code = re.search(r'An error occurred \(([A-Za-z0-9_.]+)\)', result.stderr)
              if error_code:
                  sys.exit('Exa secret sync failed: ' + error_code.group(1))
              for diagnostic in ['Unable to locate credentials', 'could not be found',
                                 'Error parsing parameter', 'Could not connect to the endpoint URL']:
                  if diagnostic in result.stderr:
                      sys.exit('Exa secret sync failed: ' + diagnostic)
              sys.exit('Exa secret sync failed with exit code ' + str(result.returncode))
          stored = json.loads(result.stdout)
          if 'AWSCURRENT' not in stored.get('VersionStages', []):
              sys.exit('The stored Exa version is not current.')
          print('Exa API key stored as AWSCURRENT; value omitted.')

      - name: Build Lambda artifacts
        run: make package-lambda

      - name: Initialize Terraform backend
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
        run: |
          terraform -chdir="${TERRAFORM_DIR}" init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="key=${TF_BACKEND_KEY}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}"

      - name: Validate AgentCore voice release gate
        if: env.TF_VAR_provision_voice_infrastructure == 'true'
        run: |
          test -n "${TF_VAR_voice_agentcore_release}" || {
            echo "::error::VOICE_AGENTCORE_RELEASE is required when voice infrastructure is provisioned."
            exit 1
          }
          if [ "${PUBLISH_VOICE_AGENTCORE_IMAGE}" = "true" ]; then
            test -n "${TF_VAR_voice_agentcore_image_tag}" || {
              echo "::error::VOICE_AGENTCORE_IMAGE_TAG is required when publishing a voice image."
              exit 1
            }
            test -z "${TF_VAR_voice_agentcore_image_digest}" || {
              echo "::error::Clear VOICE_AGENTCORE_IMAGE_DIGEST when publishing; the workflow must capture the pushed manifest digest."
              exit 1
            }
          elif ! [[ "${TF_VAR_voice_agentcore_image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::VOICE_AGENTCORE_IMAGE_DIGEST must be an exact sha256 digest when reusing a staged image."
            exit 1
          fi
          aws_cli_version="$(aws --version 2>&1)"
          aws_cli_version="${aws_cli_version#aws-cli/}"
          aws_cli_version="${aws_cli_version%% *}"
          IFS=. read -r aws_cli_major aws_cli_minor _ <<<"${aws_cli_version}"
          if [ "${aws_cli_major:-0}" -lt 2 ] || { [ "${aws_cli_major:-0}" -eq 2 ] && [ "${aws_cli_minor:-0}" -lt 35 ]; }; then
            echo "::error::AWS CLI 2.35 or newer is required for the AgentCore MMDSv2 bridge."
            exit 1
          fi

      - name: Bootstrap gated AgentCore voice registry
        if: env.TF_VAR_provision_voice_infrastructure == 'true'
        run: |
          terraform -chdir="${TERRAFORM_DIR}" plan -input=false \
            -target=aws_ecr_repository.voice_agentcore \
            -target=aws_ecr_lifecycle_policy.voice_agentcore \
            -out=voice-ecr.tfplan
          terraform -chdir="${TERRAFORM_DIR}" apply -input=false -auto-approve voice-ecr.tfplan

      - name: Set up QEMU for AgentCore voice publishing
        if: env.PUBLISH_VOICE_AGENTCORE_IMAGE == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx for AgentCore voice
        if: env.PUBLISH_VOICE_AGENTCORE_IMAGE == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Publish immutable AgentCore ARM64 image
        if: env.PUBLISH_VOICE_AGENTCORE_IMAGE == 'true'
        run: |
          repository_url="$(terraform -chdir="${TERRAFORM_DIR}" output -raw voice_agentcore_ecr_repository_url)"
          registry="${repository_url%%/*}"
          repository_name="${repository_url#*/}"
          metadata_file="${RUNNER_TEMP}/voice-agentcore-image-metadata.json"
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${registry}"
          docker buildx build --platform linux/arm64 \
            --file deploy/agentcore/Dockerfile \
            --tag "${repository_url}:${TF_VAR_voice_agentcore_image_tag}" \
            --metadata-file "${metadata_file}" \
            --push .

          image_digest="$(jq --raw-output '."containerimage.digest" // empty' "${metadata_file}")"
          if ! [[ "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The published AgentCore image did not produce an exact sha256 manifest digest."
            exit 1
          fi
          observed_digest="$(aws ecr describe-images \
            --repository-name "${repository_name}" \
            --image-ids "imageTag=${TF_VAR_voice_agentcore_image_tag}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          if [ "${observed_digest}" != "${image_digest}" ]; then
            echo "::error::The ECR tag does not resolve to the just-built immutable digest."
            exit 1
          fi
          echo "TF_VAR_voice_agentcore_image_digest=${image_digest}" >>"${GITHUB_ENV}"
          printf 'AgentCore image digest: `%s`\n' "${image_digest}" >>"${GITHUB_STEP_SUMMARY}"

      - name: Verify reused AgentCore image digest
        if: env.TF_VAR_provision_voice_infrastructure == 'true' && env.PUBLISH_VOICE_AGENTCORE_IMAGE != 'true'
        run: |
          repository_url="$(terraform -chdir="${TERRAFORM_DIR}" output -raw voice_agentcore_ecr_repository_url)"
          repository_name="${repository_url#*/}"
          observed_digest="$(aws ecr describe-images \
            --repository-name "${repository_name}" \
            --image-ids "imageDigest=${TF_VAR_voice_agentcore_image_digest}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          if [ "${observed_digest}" != "${TF_VAR_voice_agentcore_image_digest}" ]; then
            echo "::error::The requested AgentCore digest is not present in the gated ECR repository."
            exit 1
          fi

      - name: Validate AgentCore PROD promotion evidence
        if: env.TF_VAR_promote_voice_agentcore_prod == 'true'
        run: |
          if [ "${PUBLISH_VOICE_AGENTCORE_IMAGE}" = "true" ]; then
            echo "::error::PROD promotion must reuse the exact digest and release already verified in STAGING."
            exit 1
          fi
          if ! [[ "${TF_VAR_voice_agentcore_prod_version}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::VOICE_AGENTCORE_PROD_VERSION must be an explicit immutable numeric version."
            exit 1
          fi
          recorded_rollback="false"
          if [ -n "${TF_VAR_voice_agentcore_previous_prod_version}" ] && \
             [ "${TF_VAR_voice_agentcore_prod_version}" = "${TF_VAR_voice_agentcore_previous_prod_version}" ]; then
            recorded_rollback="true"
          fi
          if [ "${recorded_rollback}" != "true" ] && \
             { [ "${TF_VAR_voice_staging_verified_image_digest}" != "${TF_VAR_voice_agentcore_image_digest}" ] || \
               [ "${TF_VAR_voice_staging_verified_release}" != "${TF_VAR_voice_agentcore_release}" ] || \
               [ "${TF_VAR_voice_staging_verified_version}" != "${TF_VAR_voice_agentcore_prod_version}" ]; }; then
            echo "::error::Staging evidence must match the exact image digest, release, and AgentCore version selected for PROD."
            exit 1
          fi
          for gate in \
            TF_VAR_enable_voice_turn_udp_egress \
            TF_VAR_voice_sarvam_stt_concurrency_150_acknowledged \
            TF_VAR_voice_bulbul_concurrency_150_acknowledged \
            TF_VAR_voice_sarvam_llm_rpm_300_acknowledged \
            TF_VAR_voice_agentcore_kvs_sessions_120_acknowledged \
            TF_VAR_voice_turn_live_proof_acknowledged \
            TF_VAR_voice_load_cost_live_evidence_acknowledged \
            TF_VAR_voice_staging_verified \
            TF_VAR_voice_generic_websocket_verified; do
            if [ "${!gate}" != "true" ]; then
              echo "::error::${gate} must be explicitly acknowledged before PROD promotion."
              exit 1
            fi
          done

      - name: Terraform plan
        run: terraform -chdir="${TERRAFORM_DIR}" plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform -chdir="${TERRAFORM_DIR}" apply -input=false -auto-approve tfplan
