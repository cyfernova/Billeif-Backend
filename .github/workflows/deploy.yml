name: Terraform Deploy

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TERRAFORM_DIR: infrastructure/terraform
  AWS_REGION: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'ap-south-1' }}
  TF_BACKEND_KEY: ${{ vars.TF_STATE_KEY != '' && vars.TF_STATE_KEY || 'billeif/dev/terraform.tfstate' }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL != '' && vars.ALERT_EMAIL || 'anjishnu@cyfernova.in' }}
  TF_VAR_alert_email_subscription_confirmed: ${{ vars.ALERT_EMAIL_SUBSCRIPTION_CONFIRMED == 'true' && 'true' || 'false' }}
  TF_VAR_db_allowed_cidr: "127.0.0.1/32"
  TF_VAR_enable_application: ${{ vars.ENABLE_APPLICATION == 'true' && 'true' || 'false' }}
  TF_VAR_enable_background_processing: ${{ vars.ENABLE_BACKGROUND_PROCESSING == 'true' && 'true' || 'false' }}
  TF_VAR_enable_voice: ${{ vars.ENABLE_VOICE == 'true' && 'true' || 'false' }}
  TF_VAR_enable_rds_tunnel: "false"
  TF_VAR_llm_api_url: ${{ vars.LLM_API_URL != '' && vars.LLM_API_URL || 'https://api.deepseek.com/chat/completions' }}
  TF_VAR_llm_model: ${{ vars.LLM_MODEL != '' && vars.LLM_MODEL || 'deepseek-v4-flash' }}
  TF_VAR_deepseek_base_url: ${{ vars.DEEPSEEK_BASE_URL != '' && vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
  TF_VAR_deepseek_model: ${{ vars.DEEPSEEK_MODEL != '' && vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
  TF_VAR_ses_verified_identity: ${{ vars.SES_VERIFIED_IDENTITY != '' && vars.SES_VERIFIED_IDENTITY || 'anjishnu@cyfernova.in' }}
  TF_VAR_ses_sender_email: ${{ vars.SES_SENDER_EMAIL != '' && vars.SES_SENDER_EMAIL || 'anjishnu@cyfernova.in' }}

jobs:
  secret-scan:
    name: Scan Introduced Commits For Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan commits introduced by this event
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks-${GITLEAKS_VERSION}"

          curl --fail --silent --show-error --location \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive}" | sha256sum --check
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" -C "${install_dir}" gitleaks
          export PATH="${install_dir}:${PATH}"

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              scan_range="origin/${GITHUB_BASE_REF}..HEAD"
              ;;
            push)
              before="${{ github.event.before }}"
              if [ -n "${before}" ] && [ "${before}" != "0000000000000000000000000000000000000000" ]; then
                scan_range="${before}..${GITHUB_SHA}"
              else
                scan_range="${GITHUB_SHA}^..${GITHUB_SHA}"
              fi
              ;;
            *)
              scan_range="${GITHUB_SHA}^..${GITHUB_SHA}"
              ;;
          esac

          gitleaks detect \
            --source . \
            --log-opts="${scan_range}" \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1

  verify:
    name: Verify Build And Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false

      - name: Initialize Terraform without backend
        run: terraform -chdir="${TERRAFORM_DIR}" init -backend=false -input=false

      - name: Run Go tests
        run: go test ./...

      - name: Build Lambda artifacts
        run: make package-lambda

      - name: Check Terraform formatting
        run: terraform -chdir="${TERRAFORM_DIR}" fmt -check -recursive

      - name: Validate Terraform
        run: terraform -chdir="${TERRAFORM_DIR}" validate

      - name: Run Terraform tests
        run: terraform -chdir="${TERRAFORM_DIR}" test

  deploy:
    name: Apply Terraform
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - verify
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false

      - name: Check deployment configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
        run: |
          require() {
            if [ -z "$2" ]; then
              echo "::error::$1"
              exit 1
            fi
          }

          require "Missing AWS_DEPLOY_ROLE_ARN secret." "${AWS_DEPLOY_ROLE_ARN}"
          require "Missing TF_STATE_BUCKET secret." "${TF_STATE_BUCKET}"
          require "Missing TF_STATE_LOCK_TABLE secret." "${TF_STATE_LOCK_TABLE}"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-terraform

      - name: Build Lambda artifacts
        run: make package-lambda

      - name: Initialize Terraform backend
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
        run: |
          terraform -chdir="${TERRAFORM_DIR}" init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="key=${TF_BACKEND_KEY}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}"

      - name: Terraform plan
        env:
          TF_VAR_aws_profile: "null"
        run: terraform -chdir="${TERRAFORM_DIR}" plan -input=false -out=tfplan

      - name: Terraform apply
        env:
          TF_VAR_aws_profile: "null"
        run: terraform -chdir="${TERRAFORM_DIR}" apply -input=false -auto-approve tfplan
