name: Terraform Deploy

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TERRAFORM_DIR: infrastructure/terraform
  AWS_REGION: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'ap-south-1' }}
  TF_BACKEND_KEY: ${{ vars.TF_STATE_KEY != '' && vars.TF_STATE_KEY || 'terraform.tfstate' }}

jobs:
  secret-scan:
    name: Scan Git History For Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan full Git history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  verify:
    name: Verify Build And Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7

      - name: Run Go tests
        run: go test ./...

      - name: Build Lambda artifacts
        run: make package-lambda

      - name: Check Terraform formatting
        run: terraform -chdir="${TERRAFORM_DIR}" fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform -chdir="${TERRAFORM_DIR}" init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir="${TERRAFORM_DIR}" validate

  deploy:
    name: Apply Terraform
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - verify
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7

      - name: Check deployment configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
        run: |
          require() {
            if [ -z "$2" ]; then
              echo "::error::$1"
              exit 1
            fi
          }

          require "Missing AWS_DEPLOY_ROLE_ARN secret." "${AWS_DEPLOY_ROLE_ARN}"
          require "Missing TF_STATE_BUCKET secret." "${TF_STATE_BUCKET}"
          require "Missing TF_STATE_LOCK_TABLE secret." "${TF_STATE_LOCK_TABLE}"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-terraform

      - name: Build Lambda artifacts
        run: make package-lambda

      - name: Initialize Terraform backend
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
        run: |
          terraform -chdir="${TERRAFORM_DIR}" init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="key=${TF_BACKEND_KEY}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}"

      - name: Terraform plan
        env:
          TF_VAR_aws_profile: "null"
        run: terraform -chdir="${TERRAFORM_DIR}" plan -input=false -out=tfplan

      - name: Terraform apply
        env:
          TF_VAR_aws_profile: "null"
        run: terraform -chdir="${TERRAFORM_DIR}" apply -input=false -auto-approve tfplan
