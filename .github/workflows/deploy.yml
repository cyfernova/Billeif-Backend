name: Terraform Deploy

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_DIR: infrastructure/terraform
  AWS_REGION: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'us-east-1' }}
  TF_BACKEND_KEY: ${{ vars.TF_STATE_KEY != '' && vars.TF_STATE_KEY || 'terraform.tfstate' }}
  TF_VAR_google_client_id: ${{ secrets.TF_VAR_GOOGLE_CLIENT_ID }}
  TF_VAR_google_client_secret: ${{ secrets.TF_VAR_GOOGLE_CLIENT_SECRET }}
  TF_VAR_india_sms_sender_id: ${{ secrets.TF_VAR_INDIA_SMS_SENDER_ID }}
  TF_VAR_india_dlt_entity_id: ${{ secrets.TF_VAR_INDIA_DLT_ENTITY_ID }}
  TF_VAR_india_signup_template_id: ${{ secrets.TF_VAR_INDIA_SIGNUP_TEMPLATE_ID }}
  TF_VAR_india_auth_template_id: ${{ secrets.TF_VAR_INDIA_AUTH_TEMPLATE_ID }}
  TF_VAR_india_signup_message_template: ${{ secrets.TF_VAR_INDIA_SIGNUP_MESSAGE_TEMPLATE }}
  TF_VAR_india_auth_message_template: ${{ secrets.TF_VAR_INDIA_AUTH_MESSAGE_TEMPLATE }}
  TF_VAR_fcm_api_key: ${{ secrets.TF_VAR_FCM_API_KEY }}
  TF_VAR_apns_private_key: ${{ secrets.TF_VAR_APNS_PRIVATE_KEY }}
  TF_VAR_apns_certificate: ${{ secrets.TF_VAR_APNS_CERTIFICATE }}
  TF_VAR_environment_override: ${{ vars.TF_ENVIRONMENT }}
  TF_VAR_project_name_override: ${{ vars.TF_PROJECT_NAME }}
  TF_VAR_user_pool_name_override: ${{ vars.TF_USER_POOL_NAME }}
  TF_VAR_client_name_override: ${{ vars.TF_CLIENT_NAME }}
  TF_VAR_phone_user_pool_name_override: ${{ vars.TF_PHONE_USER_POOL_NAME }}
  TF_VAR_phone_client_name_override: ${{ vars.TF_PHONE_CLIENT_NAME }}

jobs:
  verify:
    name: Verify Build And Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Export optional Terraform overrides
        run: |
          if [ -n "${TF_VAR_environment_override}" ]; then
            echo "TF_VAR_environment=${TF_VAR_environment_override}" >> "${GITHUB_ENV}"
          fi
          if [ -n "${TF_VAR_project_name_override}" ]; then
            echo "TF_VAR_project_name=${TF_VAR_project_name_override}" >> "${GITHUB_ENV}"
          fi
          if [ -n "${TF_VAR_user_pool_name_override}" ]; then
            echo "TF_VAR_user_pool_name=${TF_VAR_user_pool_name_override}" >> "${GITHUB_ENV}"
          fi
          if [ -n "${TF_VAR_client_name_override}" ]; then
            echo "TF_VAR_client_name=${TF_VAR_client_name_override}" >> "${GITHUB_ENV}"
          fi
          if [ -n "${TF_VAR_phone_user_pool_name_override}" ]; then
            echo "TF_VAR_phone_user_pool_name=${TF_VAR_phone_user_pool_name_override}" >> "${GITHUB_ENV}"
          fi
          if [ -n "${TF_VAR_phone_client_name_override}" ]; then
            echo "TF_VAR_phone_client_name=${TF_VAR_phone_client_name_override}" >> "${GITHUB_ENV}"
          fi

      - name: Run Go tests
        run: go test ./...

      - name: Build Lambda artifacts
        run: make package-lambda

      - name: Check Terraform formatting
        run: terraform -chdir="${TERRAFORM_DIR}" fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform -chdir="${TERRAFORM_DIR}" init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir="${TERRAFORM_DIR}" validate

  deploy:
    name: Apply Terraform
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Export optional Terraform overrides
        run: |
          if [ -n "${TF_VAR_environment_override}" ]; then
            echo "TF_VAR_environment=${TF_VAR_environment_override}" >> "${GITHUB_ENV}"
          fi
          if [ -n "${TF_VAR_project_name_override}" ]; then
            echo "TF_VAR_project_name=${TF_VAR_project_name_override}" >> "${GITHUB_ENV}"
          fi
          if [ -n "${TF_VAR_user_pool_name_override}" ]; then
            echo "TF_VAR_user_pool_name=${TF_VAR_user_pool_name_override}" >> "${GITHUB_ENV}"
          fi
          if [ -n "${TF_VAR_client_name_override}" ]; then
            echo "TF_VAR_client_name=${TF_VAR_client_name_override}" >> "${GITHUB_ENV}"
          fi
          if [ -n "${TF_VAR_phone_user_pool_name_override}" ]; then
            echo "TF_VAR_phone_user_pool_name=${TF_VAR_phone_user_pool_name_override}" >> "${GITHUB_ENV}"
          fi
          if [ -n "${TF_VAR_phone_client_name_override}" ]; then
            echo "TF_VAR_phone_client_name=${TF_VAR_phone_client_name_override}" >> "${GITHUB_ENV}"
          fi

      - name: Check deployment configuration
        id: check_config
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          configured=0

          require() {
            if [ -z "$2" ]; then
              echo "::warning::$1 (deploy will be skipped)"
            else
              configured=1
            fi
          }

          if [ -z "${AWS_DEPLOY_ROLE_ARN}" ] && { [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; }; then
            echo "::warning::AWS credentials not configured (deploy will be skipped)"
          else
            configured=1
          fi

          # Set output for conditional AWS credentials
          if [ -n "${AWS_DEPLOY_ROLE_ARN}" ]; then
            echo "USE_OIDC=true" >> "$GITHUB_OUTPUT"
          else
            echo "USE_OIDC=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "${configured}" = "1" ]; then
            echo "DEPLOY_ENABLED=true" >> "$GITHUB_OUTPUT"
            echo "All required secrets are configured, deploy will proceed."
          else
            echo "DEPLOY_ENABLED=false" >> "$GITHUB_OUTPUT"
            echo "Deploy skipped: missing required secrets."
          fi

      - name: Configure AWS credentials with OIDC
        if: steps.check_config.outputs.DEPLOY_ENABLED == 'true' && steps.check_config.outputs.USE_OIDC == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-terraform

      - name: Configure AWS credentials with access keys
        if: steps.check_config.outputs.DEPLOY_ENABLED == 'true' && steps.check_config.outputs.USE_OIDC != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Build Lambda artifacts
        if: steps.check_config.outputs.DEPLOY_ENABLED == 'true'
        run: make package-lambda

      - name: Initialize Terraform backend
        if: steps.check_config.outputs.DEPLOY_ENABLED == 'true'
        run: |
          terraform -chdir="${TERRAFORM_DIR}" init -input=false

      - name: Terraform plan
        if: steps.check_config.outputs.DEPLOY_ENABLED == 'true'
        run: terraform -chdir="${TERRAFORM_DIR}" plan -input=false -out=tfplan

      - name: Upload Terraform plan
        if: always() && steps.check_config.outputs.DEPLOY_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TERRAFORM_DIR }}/tfplan
          if-no-files-found: ignore

      - name: Terraform apply
        if: steps.check_config.outputs.DEPLOY_ENABLED == 'true'
        run: terraform -chdir="${TERRAFORM_DIR}" apply -input=false -auto-approve tfplan
