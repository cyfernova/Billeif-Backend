name: Build Lambda Artifacts

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Serverless Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build and package Lambda artifacts
        run: make package-lambda

      - name: Upload Lambda artifacts
        uses: actions/upload-artifact@v6
        with:
          name: lambda-artifacts
          path: |
            .build/lambda/http.zip
            .build/lambda/a2a-stream.zip
            .build/lambda/sqs-invoice.zip
            .build/lambda/sqs-payment.zip
            .build/lambda/ws.zip
          if-no-files-found: error
