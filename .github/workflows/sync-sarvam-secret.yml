name: Sync Sarvam secret

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-sarvam-secret
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: sarvam-sync-${{ github.run_id }}

      - name: Store Sarvam API key
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          AWS_PROFILE: default
          AWS_DEFAULT_PROFILE: default
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys

          api_key = os.environ.pop('SARVAM_API_KEY', '').strip()
          if not api_key:
              sys.exit('SARVAM_API_KEY is missing or empty.')
          payload = json.dumps({
              'SecretId': '/billeif/dev/providers/sarvam',
              'SecretString': json.dumps({'api_key': api_key}),
          })
          # Send the value over stdin, never command arguments or workflow output.
          result = subprocess.run(
              ['aws', 'secretsmanager', 'put-secret-value', '--region', 'ap-south-1',
               '--cli-input-json', 'file:///dev/stdin', '--output', 'json'],
              input=payload, text=True, capture_output=True, check=False,
          )
          if result.returncode:
              sys.exit('Sarvam secret sync failed. Check the deployment role permissions.')
          stored = json.loads(result.stdout)
          if 'AWSCURRENT' not in stored.get('VersionStages', []):
              sys.exit('The stored Sarvam version is not current.')
          print('Sarvam API key stored as AWSCURRENT; secret value omitted.')
