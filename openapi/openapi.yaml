openapi: 3.0.3
info:
  title: Invoice Backend API
  description: Production-grade invoice/billing platform API
  version: 1.0.0
  contact:
    name: API Support
    email: support@invoiceapp.local

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: http://localhost:8080/api/v1
    description: API v1 base path

tags:
  - name: A2A
    description: Latest A2A HTTP+JSON protocol surface
  - name: Auth
    description: Authentication and authorization
  - name: Business
    description: Business profile management
  - name: Customers
    description: Customer management
  - name: Vendors
    description: Vendor management
  - name: Products
    description: Product catalog and inventory
  - name: Invoices
    description: Invoice management and PDF generation
  - name: Payments
    description: Payment recording and reconciliation
  - name: Ledger
    description: Financial ledger and reports
  - name: Teams
    description: Team member management
  - name: Webhooks
    description: Webhook configuration
  - name: Subscriptions
    description: Subscription plans
  - name: Admin
    description: Admin operations

paths:
  /api/v1/subscriptions/checkout:
    post:
      tags: [Subscriptions]
      summary: Start renewable subscription checkout
      description: Creates a genuine Razorpay subscription without granting paid access before a signed verified charge. Successful idempotency replay returns the immutable original pending checkout response.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionCheckoutRequest'}}}
      responses:
        '200': {description: Pending authorization, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionCheckoutResponse'}}}}
        '400': {$ref: '#/components/responses/SubscriptionBadRequest'}
        '409': {$ref: '#/components/responses/SubscriptionConflict'}
        '422': {$ref: '#/components/responses/SubscriptionProviderRejected'}
        '500': {$ref: '#/components/responses/SubscriptionMutationInternal'}
        '503': {$ref: '#/components/responses/SubscriptionReconciliation'}

  /api/v1/subscriptions/plan-change:
    post:
      tags: [Subscriptions]
      summary: Schedule a no-proration plan change
      description: Effective only at the next verified billing boundary; over-quota downgrades retain existing data.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionPlanChangeRequest'}}}
      responses:
        '200': {description: Change scheduled, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionMutationResponse'}}}}
        '400': {$ref: '#/components/responses/SubscriptionBadRequest'}
        '409': {$ref: '#/components/responses/SubscriptionConflict'}
        '422': {$ref: '#/components/responses/SubscriptionProviderRejected'}
        '500': {$ref: '#/components/responses/SubscriptionMutationInternal'}
        '503': {$ref: '#/components/responses/SubscriptionReconciliation'}

  /api/v1/subscriptions/cancellation:
    post:
      tags: [Subscriptions]
      summary: Schedule cancellation at paid period end
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionCancellationRequest'}}}
      responses:
        '200': {description: Cancellation scheduled, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionMutationResponse'}}}}
        '400': {$ref: '#/components/responses/SubscriptionBadRequest'}
        '409': {$ref: '#/components/responses/SubscriptionConflict'}
        '422': {$ref: '#/components/responses/SubscriptionProviderRejected'}
        '500': {$ref: '#/components/responses/SubscriptionMutationInternal'}
        '503': {$ref: '#/components/responses/SubscriptionReconciliation'}

  /api/v1/subscriptions/billing-history:
    get:
      tags: [Subscriptions]
      summary: List tenant billing history
      security: [{bearerAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Provider-verified records without provider identifiers
          content: {application/json: {schema: {type: object, required: [records], properties: {records: {type: array, items: {$ref: '#/components/schemas/SubscriptionBillingRecord'}}}}}}
        '400': {$ref: '#/components/responses/SubscriptionBadRequest'}
        '500': {$ref: '#/components/responses/SubscriptionInternal'}
        '503': {$ref: '#/components/responses/SubscriptionReconciliation'}

  /api/v1/subscriptions/audit:
    get:
      tags: [Subscriptions]
      summary: List sanitized tenant lifecycle audit
      security: [{bearerAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Sanitized lifecycle audit
          content: {application/json: {schema: {type: object, required: [records], properties: {records: {type: array, items: {$ref: '#/components/schemas/SubscriptionAuditRecord'}}}}}}
        '400': {$ref: '#/components/responses/SubscriptionBadRequest'}
        '500': {$ref: '#/components/responses/SubscriptionInternal'}
        '503': {$ref: '#/components/responses/SubscriptionReconciliation'}

  /.well-known/agent-card.json:
    get:
      tags: [A2A]
      summary: Latest A2A agent card
      operationId: getA2AAgentCard
      responses:
        '200':
          description: Latest A2A agent card
          content:
            application/a2a+json:
              schema:
                type: object

  /api/v1/a2a/message:send:
    post:
      tags: [A2A]
      summary: Send an A2A message
      operationId: a2aMessageSend
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/a2a+json:
            schema:
              type: object
      responses:
        '200':
          description: Task or message response
          content:
            application/a2a+json:
              schema:
                type: object
        '400':
          description: Invalid request or unsupported A2A version
          content:
            application/problem+json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/a2a/message:stream:
    post:
      tags: [A2A]
      summary: Stream an A2A message execution
      operationId: a2aMessageStream
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/a2a+json:
            schema:
              type: object
      responses:
        '200':
          description: SSE stream of A2A events
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/a2a/tasks:
    get:
      tags: [A2A]
      summary: List A2A tasks
      operationId: a2aListTasks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated A2A tasks
          content:
            application/a2a+json:
              schema:
                type: object

  /api/v1/a2a/tasks/{taskId}:
    get:
      tags: [A2A]
      summary: Get A2A task
      operationId: a2aGetTask
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A2A task snapshot
          content:
            application/a2a+json:
              schema:
                type: object

  /api/v1/a2a/tasks/{taskId}:cancel:
    post:
      tags: [A2A]
      summary: Cancel A2A task
      operationId: a2aCancelTask
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancelled A2A task
          content:
            application/a2a+json:
              schema:
                type: object

  /api/v1/a2a/tasks/{taskId}/subscribe:
    get:
      tags: [A2A]
      summary: Subscribe to A2A task updates
      operationId: a2aSubscribeTask
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SSE stream of task events
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/a2a/tasks/{taskId}/pushNotificationConfigs:
    get:
      tags: [A2A]
      summary: List task push notification configs
      operationId: a2aListPushConfigs
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task push notification configs
          content:
            application/a2a+json:
              schema:
                type: object
    post:
      tags: [A2A]
      summary: Create task push notification config
      operationId: a2aCreatePushConfig
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/a2a+json:
            schema:
              type: object
      responses:
        '200':
          description: Created task push notification config
          content:
            application/a2a+json:
              schema:
                type: object

  /api/v1/a2a/tasks/{taskId}/pushNotificationConfigs/{configId}:
    get:
      tags: [A2A]
      summary: Get task push notification config
      operationId: a2aGetPushConfig
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - name: configId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task push notification config
          content:
            application/a2a+json:
              schema:
                type: object
    delete:
      tags: [A2A]
      summary: Delete task push notification config
      operationId: a2aDeletePushConfig
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - name: configId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted

  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset code sent if email exists

  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with code
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully

  /api/v1/auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email address
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified

  /api/v1/auth/resend-verification:
    post:
      tags: [Auth]
      summary: Resend verification code
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Verification code sent

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/v1/auth/profile:
    put:
      tags: [Auth]
      summary: Update profile
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Change password
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed

  /api/v1/auth/profile-picture:
    post:
      tags: [Auth]
      summary: Get profile picture upload URL
      operationId: getProfilePictureUploadUrl
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/UploadSizeBytes5MiB'
      responses:
        '200':
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
    put:
      tags: [Auth]
      summary: Update profile picture URL
      operationId: updateProfilePicture
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_picture_url]
              properties:
                profile_picture_url:
                  type: string
                  format: uri
      responses:
        '200':
          description: Profile picture updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/v1/business-profiles:
    get:
      tags: [Business]
      summary: List business profiles
      operationId: listBusinessProfiles
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List of business profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessListResponse'
    post:
      tags: [Business]
      summary: Create business profile
      operationId: createBusinessProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBusinessRequest'
      responses:
        '201':
          description: Business created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfile'

  /api/v1/business-profiles/{id}:
    get:
      tags: [Business]
      summary: Get business profile
      operationId: getBusinessProfile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Business profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfile'
    put:
      tags: [Business]
      summary: Update business profile
      operationId: updateBusinessProfile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBusinessRequest'
      responses:
        '200':
          description: Business updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfile'
    delete:
      tags: [Business]
      summary: Delete business profile
      operationId: deleteBusinessProfile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Business deleted

  /api/v1/business-profiles/{id}/logo:
    post:
      tags: [Business]
      summary: Get logo upload URL
      operationId: getLogoUploadUrl
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/UploadSizeBytes5MiB'
      responses:
        '200':
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'

  /api/v1/customers:
    get:
      tags: [Customers]
      summary: List customers
      operationId: listCustomers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
    post:
      tags: [Customers]
      summary: Create customer
      operationId: createCustomer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /api/v1/customers/{id}:
    get:
      tags: [Customers]
      summary: Get customer
      operationId: getCustomer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Customer details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
    put:
      tags: [Customers]
      summary: Update customer
      operationId: updateCustomer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Customer updated
    delete:
      tags: [Customers]
      summary: Delete customer
      operationId: deleteCustomer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Customer deleted

  /api/v1/customers/import:
    post:
      tags: [Customers]
      summary: Bulk import customers
      operationId: importCustomers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer

  /api/v1/customers/export:
    get:
      tags: [Customers]
      summary: Export customers
      operationId: exportCustomers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessID'
      responses:
        '200':
          description: All customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'

  /api/v1/invoices:
    get:
      tags: [Invoices]
      summary: List invoices
      operationId: listInvoices
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List of invoices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceListResponse'
    post:
      tags: [Invoices]
      summary: Create invoice
      operationId: createInvoice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
      responses:
        '201':
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /api/v1/invoices/{id}:
    get:
      tags: [Invoices]
      summary: Get invoice
      operationId: getInvoice
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Invoice details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
    put:
      tags: [Invoices]
      summary: Update invoice
      operationId: updateInvoice
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInvoiceRequest'
      responses:
        '200':
          description: Invoice updated
    delete:
      tags: [Invoices]
      summary: Delete invoice
      operationId: deleteInvoice
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Invoice deleted

  /api/v1/invoices/{id}/issue:
    post:
      tags: [Invoices]
      summary: Issue an invoice
      operationId: issueInvoice
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_type, series]
              properties:
                document_type:
                  type: string
                  enum: [tax_invoice, bill_of_supply]
                series:
                  type: string
                  pattern: '^[A-Z]{1,3}$'
      responses:
        '202':
          description: Invoice issued and final render queued
        '400':
          description: Invalid issue command or lifecycle
        '404':
          description: Tenant-scoped invoice not found
        '409':
          description: Version, lifecycle, idempotency, or sequence conflict

  /api/v1/invoices/{id}/pdf:
    get:
      tags: [Invoices]
      summary: Get invoice PDF URL
      operationId: getInvoicePdf
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: PDF URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  pdf_url:
                    type: string

  /api/v1/payments:
    get:
      tags: [Payments]
      summary: List payments
      operationId: listPayments
      security:
        - bearerAuth: []
      parameters:
        - name: invoice_id
          in: query
          required: true
          schema:
            type: string
