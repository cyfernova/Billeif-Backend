openapi: 3.0.3
info:
  title: Invoice Backend API
  description: Production-grade invoice/billing platform API
  version: 1.0.0
  contact:
    name: API Support
    email: support@invoiceapp.local

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: http://localhost:8080/api/v1
    description: API v1 base path

tags:
  - name: Operations
    description: Tenant-scoped sanitized aggregate operational visibility and proven safe recovery
  - name: Operator Operations
    description: Separately authorized operator detail and fail-closed high-risk recovery
  - name: A2A
    description: Latest A2A HTTP+JSON protocol surface
  - name: Auth
    description: Authentication and authorization
  - name: Business
    description: Business profile management
  - name: Customers
    description: Customer management
  - name: Vendors
    description: Vendor management
  - name: Products
    description: Product catalog and inventory
  - name: Invoices
    description: Invoice management and PDF generation
  - name: Payments
    description: Payment recording and reconciliation
  - name: Ledger
    description: Financial ledger and reports
  - name: Teams
    description: Team member management
  - name: Webhooks
    description: Webhook configuration
  - name: Subscriptions
    description: Subscription plans
  - name: Admin
    description: Admin operations

paths:
  /api/v1/operations:
    get:
      tags: [Operations]
      summary: List business operations
      description: Stable bounded aggregate across render, delivery, outbox, Razorpay, GST, recurring, email, WhatsApp, notifications, imports, and voice. Unsupported sources are listed in unavailable_types. Unknown and reconciliation_required remain distinct; provider references, queue IDs, payloads, raw errors, account IDs, secrets, and topology are omitted.
      security: [{bearerAuth: []}]
      parameters:
        - {name: type, in: query, schema: {type: array, items: {$ref: '#/components/schemas/OperationType'}}}
        - {name: status, in: query, schema: {type: array, items: {$ref: '#/components/schemas/OperationStatus'}}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 2048}}
      responses:
        '200': {description: Sanitized tenant operation page, content: {application/json: {schema: {$ref: '#/components/schemas/OperationListResponse'}}}}
        '400': {description: invalid_operation_query, content: {application/json: {schema: {$ref: '#/components/schemas/OperationError'}}}}
        '403': {description: Business or all-branches scope required, content: {application/json: {schema: {$ref: '#/components/schemas/OperationError'}}}}
  /api/v1/operations/{operation_id}:
    get:
      tags: [Operations]
      summary: Get a business operation
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/OperationID'}]
      responses:
        '200': {description: Sanitized operation, content: {application/json: {schema: {$ref: '#/components/schemas/OperationSummary'}}}}
        '404': {description: operation_not_found, content: {application/json: {schema: {$ref: '#/components/schemas/OperationError'}}}}
  /api/v1/operations/{operation_id}/timeline:
    get:
      tags: [Operations]
      summary: Get sanitized business operation timeline
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/OperationID'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: Sanitized lifecycle and recovery events, content: {application/json: {schema: {$ref: '#/components/schemas/OperationTimeline'}}}}
        '400': {description: invalid_operation_query, content: {application/json: {schema: {$ref: '#/components/schemas/OperationError'}}}}
        '404': {description: operation_not_found, content: {application/json: {schema: {$ref: '#/components/schemas/OperationError'}}}}
  /api/v1/operations/{operation_id}/recovery:
    post:
      tags: [Operations]
      summary: Retry an exact failed versioned invoice render
      description: The only business recovery currently proven safe is retry of a failed invoice_render. It requires documents.manage, live render capabilities, original tenant/resource/revision binding, UUID idempotency and correlation identities, and atomic audit plus outbox dispatch.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/OperationID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OperationRecoveryRequest'}}}}
      responses:
        '202': {description: Accepted or idempotently replayed command, content: {application/json: {schema: {$ref: '#/components/schemas/OperationRecoveryResponse'}}}}
        '400': {description: invalid_recovery_request, content: {application/json: {schema: {$ref: '#/components/schemas/OperationError'}}}}
        '403': {description: operation_access_denied, content: {application/json: {schema: {$ref: '#/components/schemas/OperationError'}}}}
        '404': {description: operation_not_found, content: {application/json: {schema: {$ref: '#/components/schemas/OperationError'}}}}
        '409': {description: unsafe_replay, content: {application/json: {schema: {$ref: '#/components/schemas/OperationError'}}}}
        '422': {description: unsupported_recovery, content: {application/json: {schema: {$ref: '#/components/schemas/OperationError'}}}}
  /api/v1/operator/operations/{operation_id}:
    get:
      tags: [Operator Operations]
      summary: Get separately authorized operator detail
      description: Requires the configured verified platform operator JWT group. Business owner/admin roles never grant access and missing group configuration fails closed. Detail remains sanitized.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/OperationID'}, {$ref: '#/components/parameters/OperationBusinessID'}]
      responses:
        '200': {description: Sanitized operator detail, content: {application/json: {schema: {$ref: '#/components/schemas/OperationOperatorDetail'}}}}
        '403': {description: operator_not_configured or operator_access_denied, content: {application/json: {schema: {$ref: '#/components/schemas/OperationError'}}}}
        '404': {description: operation_not_found, content: {application/json: {schema: {$ref: '#/components/schemas/OperationError'}}}}
  /api/v1/operator/operations/{operation_id}/timeline:
    get:
      tags: [Operator Operations]
      summary: Get separately authorized sanitized timeline
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/OperationID'}
        - {$ref: '#/components/parameters/OperationBusinessID'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: Sanitized timeline, content: {application/json: {schema: {$ref: '#/components/schemas/OperationTimeline'}}}}
        '403': {description: Operator access denied, content: {application/json: {schema: {$ref: '#/components/schemas/OperationError'}}}}
        '404': {description: operation_not_found, content: {application/json: {schema: {$ref: '#/components/schemas/OperationError'}}}}
  /api/v1/operator/operations/{operation_id}/recovery:
    post:
      tags: [Operator Operations]
      summary: Request operator recovery
      description: High-risk webhook, reconciliation, DLQ and resolution actions are durably audited but fail closed with step_up_required until Task 5 supplies a valid one-time scoped token. No provider action or redrive occurs in this phase.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/OperationID'}
        - {$ref: '#/components/parameters/OperationBusinessID'}
        - {name: X-Step-Up-Token, in: header, required: false, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OperationRecoveryRequest'}}}}
      responses:
        '202': {description: Accepted command after a future valid step-up boundary, content: {application/json: {schema: {$ref: '#/components/schemas/OperationRecoveryResponse'}}}}
        '403': {description: Operator access denied, content: {application/json: {schema: {$ref: '#/components/schemas/OperationError'}}}}
        '404': {description: operation_not_found, content: {application/json: {schema: {$ref: '#/components/schemas/OperationError'}}}}
        '409': {description: unsafe_replay, content: {application/json: {schema: {$ref: '#/components/schemas/OperationError'}}}}
        '422': {description: unsupported_recovery, content: {application/json: {schema: {$ref: '#/components/schemas/OperationError'}}}}
        '428': {description: step_up_required, content: {application/json: {schema: {$ref: '#/components/schemas/OperationError'}}}}
        '503': {description: recovery_audit_unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/OperationError'}}}}
  /api/v1/subscriptions/checkout:
    post:
      tags: [Subscriptions]
      summary: Start renewable subscription checkout
      description: Creates a genuine Razorpay subscription without granting paid access before a signed verified charge. Successful idempotency replay returns the immutable original pending checkout response.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionCheckoutRequest'}}}
      responses:
        '200': {description: Pending authorization, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionCheckoutResponse'}}}}
        '400': {$ref: '#/components/responses/SubscriptionBadRequest'}
        '409': {$ref: '#/components/responses/SubscriptionConflict'}
        '422': {$ref: '#/components/responses/SubscriptionProviderRejected'}
        '500': {$ref: '#/components/responses/SubscriptionMutationInternal'}
        '503': {$ref: '#/components/responses/SubscriptionReconciliation'}

  /api/v1/subscriptions/plan-change:
    post:
      tags: [Subscriptions]
      summary: Schedule a no-proration plan change
      description: Effective only at the next verified billing boundary; over-quota downgrades retain existing data.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionPlanChangeRequest'}}}
      responses:
        '200': {description: Change scheduled, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionMutationResponse'}}}}
        '400': {$ref: '#/components/responses/SubscriptionBadRequest'}
        '409': {$ref: '#/components/responses/SubscriptionConflict'}
        '422': {$ref: '#/components/responses/SubscriptionProviderRejected'}
        '500': {$ref: '#/components/responses/SubscriptionMutationInternal'}
        '503': {$ref: '#/components/responses/SubscriptionReconciliation'}

  /api/v1/subscriptions/cancellation:
    post:
      tags: [Subscriptions]
      summary: Schedule cancellation at paid period end
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionCancellationRequest'}}}
      responses:
        '200': {description: Cancellation scheduled, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionMutationResponse'}}}}
        '400': {$ref: '#/components/responses/SubscriptionBadRequest'}
        '409': {$ref: '#/components/responses/SubscriptionConflict'}
        '422': {$ref: '#/components/responses/SubscriptionProviderRejected'}
        '500': {$ref: '#/components/responses/SubscriptionMutationInternal'}
        '503': {$ref: '#/components/responses/SubscriptionReconciliation'}

  /api/v1/subscriptions/billing-history:
    get:
      tags: [Subscriptions]
      summary: List tenant billing history
      security: [{bearerAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Provider-verified records without provider identifiers
          content: {application/json: {schema: {type: object, required: [records], properties: {records: {type: array, items: {$ref: '#/components/schemas/SubscriptionBillingRecord'}}}}}}
        '400': {$ref: '#/components/responses/SubscriptionBadRequest'}
        '500': {$ref: '#/components/responses/SubscriptionInternal'}
        '503': {$ref: '#/components/responses/SubscriptionReconciliation'}

  /api/v1/subscriptions/audit:
    get:
      tags: [Subscriptions]
      summary: List sanitized tenant lifecycle audit
      security: [{bearerAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Sanitized lifecycle audit
          content: {application/json: {schema: {type: object, required: [records], properties: {records: {type: array, items: {$ref: '#/components/schemas/SubscriptionAuditRecord'}}}}}}
        '400': {$ref: '#/components/responses/SubscriptionBadRequest'}
        '500': {$ref: '#/components/responses/SubscriptionInternal'}
        '503': {$ref: '#/components/responses/SubscriptionReconciliation'}

  /.well-known/agent-card.json:
    get:
      tags: [A2A]
      summary: Latest A2A agent card
      operationId: getA2AAgentCard
      responses:
        '200':
          description: Latest A2A agent card
          content:
            application/a2a+json:
              schema:
                type: object

  /api/v1/a2a/message:send:
    post:
      tags: [A2A]
      summary: Send an A2A message
      operationId: a2aMessageSend
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/a2a+json:
            schema:
              type: object
      responses:
        '200':
          description: Task or message response
          content:
            application/a2a+json:
              schema:
                type: object
        '400':
          description: Invalid request or unsupported A2A version
          content:
            application/problem+json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/a2a/message:stream:
    post:
      tags: [A2A]
      summary: Stream an A2A message execution
      operationId: a2aMessageStream
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/a2a+json:
            schema:
              type: object
      responses:
        '200':
          description: SSE stream of A2A events
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/a2a/tasks:
    get:
      tags: [A2A]
      summary: List A2A tasks
      operationId: a2aListTasks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated A2A tasks
          content:
            application/a2a+json:
              schema:
                type: object

  /api/v1/a2a/tasks/{taskId}:
    get:
      tags: [A2A]
      summary: Get A2A task
      operationId: a2aGetTask
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A2A task snapshot
          content:
            application/a2a+json:
              schema:
                type: object

  /api/v1/a2a/tasks/{taskId}:cancel:
    post:
      tags: [A2A]
      summary: Cancel A2A task
      operationId: a2aCancelTask
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancelled A2A task
          content:
            application/a2a+json:
              schema:
                type: object

  /api/v1/a2a/tasks/{taskId}/subscribe:
    get:
      tags: [A2A]
      summary: Subscribe to A2A task updates
      operationId: a2aSubscribeTask
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SSE stream of task events
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/a2a/tasks/{taskId}/pushNotificationConfigs:
    get:
      tags: [A2A]
      summary: List task push notification configs
      operationId: a2aListPushConfigs
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task push notification configs
          content:
            application/a2a+json:
              schema:
                type: object
    post:
      tags: [A2A]
      summary: Create task push notification config
      operationId: a2aCreatePushConfig
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/a2a+json:
            schema:
              type: object
      responses:
        '200':
          description: Created task push notification config
          content:
            application/a2a+json:
              schema:
                type: object

  /api/v1/a2a/tasks/{taskId}/pushNotificationConfigs/{configId}:
    get:
      tags: [A2A]
      summary: Get task push notification config
      operationId: a2aGetPushConfig
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - name: configId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task push notification config
          content:
            application/a2a+json:
              schema:
                type: object
    delete:
      tags: [A2A]
      summary: Delete task push notification config
      operationId: a2aDeletePushConfig
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - name: configId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted

  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset code sent if email exists

  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with code
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully

  /api/v1/auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email address
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified

  /api/v1/auth/resend-verification:
    post:
      tags: [Auth]
      summary: Resend verification code
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Verification code sent

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/v1/auth/profile:
    put:
      tags: [Auth]
      summary: Update profile
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Change password
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed

  /api/v1/auth/profile-picture:
    post:
      tags: [Auth]
      summary: Get profile picture upload URL
      operationId: getProfilePictureUploadUrl
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/UploadSizeBytes5MiB'
      responses:
        '200':
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
    put:
      tags: [Auth]
      summary: Update profile picture URL
      operationId: updateProfilePicture
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_picture_url]
              properties:
                profile_picture_url:
                  type: string
                  format: uri
      responses:
        '200':
          description: Profile picture updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/v1/business-profiles:
    get:
      tags: [Business]
      summary: List business profiles
      operationId: listBusinessProfiles
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List of business profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessListResponse'
    post:
      tags: [Business]
      summary: Create business profile
      operationId: createBusinessProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBusinessRequest'
      responses:
        '201':
          description: Business created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfile'

  /api/v1/business-profiles/{id}:
    get:
      tags: [Business]
      summary: Get business profile
      operationId: getBusinessProfile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Business profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfile'
    put:
      tags: [Business]
      summary: Update business profile
      operationId: updateBusinessProfile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBusinessRequest'
      responses:
        '200':
          description: Business updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfile'
    delete:
      tags: [Business]
      summary: Delete business profile
      operationId: deleteBusinessProfile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Business deleted

  /api/v1/business-profiles/{id}/logo:
    post:
      tags: [Business]
      summary: Get logo upload URL
      operationId: getLogoUploadUrl
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/UploadSizeBytes5MiB'
      responses:
        '200':
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'

  /api/v1/customers:
    get:
