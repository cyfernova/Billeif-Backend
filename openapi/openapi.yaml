                      $ref: '#/components/schemas/EmailPayload'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BusinessID:
      name: business_id
      in: query
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 10
        maximum: 100
    ContentType:
      name: Content-Type
      in: header
      schema:
        type: string
        default: image/png
    UploadSizeBytes5MiB:
      name: size_bytes
      in: query
      required: true
      description: Exact upload size in bytes; the signed PUT must use this Content-Length.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 5242880
 
  responses:
    SubscriptionBadRequest:
      description: Invalid subscription request
      content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionError'}}}
    SubscriptionConflict:
      description: Lifecycle or idempotency conflict
      content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionError'}}}
    SubscriptionProviderRejected:
      description: Provider deterministically rejected the mutation
      content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionError'}}}
    SubscriptionInternal:
      description: Subscription history could not be loaded
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SubscriptionError'}
          example: {error: {code: subscription_internal_error, message: subscription history could not be loaded}}
    SubscriptionMutationInternal:
      description: Subscription request could not be completed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SubscriptionError'}
          example: {error: {code: subscription_mutation_internal_error, message: subscription request could not be completed}}
    SubscriptionReconciliation:
      description: Provider outcome requires reconciliation or the service is unavailable
      content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionError'}}}
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    SubscriptionCheckoutRequest:
      type: object
      required: [plan_id, idempotency_key]
      properties:
        plan_id: {type: string, enum: [pro_monthly, rise_monthly, biz_monthly]}
        idempotency_key: {type: string, minLength: 1, maxLength: 180}
    SubscriptionPlanChangeRequest:
      allOf: [{$ref: '#/components/schemas/SubscriptionCheckoutRequest'}]
    SubscriptionCancellationRequest:
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key: {type: string, minLength: 1, maxLength: 180}
    SubscriptionCheckoutResponse:
      type: object
      required: [subscription_id, status, billing_mode, pending_plan_id]
      properties:
        subscription_id: {type: string, format: uuid}
        status: {type: string, enum: [pending_payment]}
        billing_mode: {type: string, enum: [renewable]}
        pending_plan_id: {type: string, enum: [pro_monthly, rise_monthly, biz_monthly]}
        authorization_url: {type: string, format: uri}
    SubscriptionMutationResponse:
      type: object
      required: [subscription_id, status, plan_id, cancel_at_period_end, reconciliation_required]
      properties:
        subscription_id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/SubscriptionLifecycleStatus'}
        plan_id: {type: string, enum: [free, pro_monthly, rise_monthly, biz_monthly]}
        pending_plan_id: {type: string, enum: [pro_monthly, rise_monthly, biz_monthly]}
        effective_at: {type: string, format: date-time}
        cancel_at_period_end: {type: boolean}
        reconciliation_required: {type: boolean}
    SubscriptionLifecycleStatus:
      type: string
      enum: [pending_payment, active, renewal_pending, past_due, grace_period, cancellation_scheduled, cancelled, expired, suspended, reconciliation_required]
    SubscriptionBillingRecord:
      type: object
      required: [id, business_id, subscription_id, amount_minor, currency, status, receipt_reference, occurred_at, created_at]
      properties:
        id: {type: string, format: uuid}
        business_id: {type: string, format: uuid}
        subscription_id: {type: string, format: uuid}
        amount_minor: {type: integer, format: int64, minimum: 0}
        currency: {type: string, enum: [INR]}
        status: {type: string, enum: [paid, failed, provider_verified]}
        receipt_reference: {type: string}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        quota_period_start: {type: string, format: date-time}
        quota_period_end: {type: string, format: date-time}
        occurred_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    SubscriptionAuditRecord:
      type: object
      required: [id, business_id, action, code, occurred_at, created_at]
      properties:
        id: {type: string, format: uuid}
        business_id: {type: string, format: uuid}
        subscription_id: {type: string, format: uuid}
        actor_user_id: {type: string}
        action: {type: string}
        from_status: {type: string}
        to_status: {type: string}
        from_plan_id: {type: string}
        to_plan_id: {type: string}
        code: {type: string}
        occurred_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    SubscriptionError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, enum: [subscription_invalid_request, subscription_invalid_limit, subscription_conflict, subscription_provider_rejected, subscription_reconciliation_required, subscription_unavailable, subscription_internal_error, subscription_mutation_internal_error]}
            message: {type: string}
    Error:
      type: object
      properties:
        error:
          type: string
        request_id:
          type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
        services:
          type: object

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 2

    RegisterResponse:
      type: object
      properties:
        user_id:
          type: string
        message:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        token_type:
          type: string

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required: [email, confirmation_code, new_password]
      properties:
        email:
          type: string
          format: email
        confirmation_code:
          type: string
        new_password:
          type: string
          minLength: 8

    VerifyEmailRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string

    UpdateProfileRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
        new_password:
          type: string
          minLength: 8

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        cognito_id:
          type: string
        role:
          type: string
          enum: [admin, accountant, viewer]
        profile_picture_url:
          type: string
          format: uri
        is_email_verified:
          type: boolean
        business_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BusinessProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        zip_code:
          type: string
        tax_id:
          type: string
        currency:
          type: string
        logo_url:
          type: string
        invoice_prefix:
          type: string
        created_at:
          type: string
          format: date-time

    CreateBusinessRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        zip_code:
          type: string
        tax_id:
          type: string
        currency:
          type: string
        invoice_prefix:
          type: string

    UpdateBusinessRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string

    BusinessListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BusinessProfile'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        business_id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        zip_code:
          type: string
        tax_id:
          type: string
        credit_limit:
          type: number
        payment_terms:
          type: integer

    CreateCustomerRequest:
      type: object
      required: [business_id, name, email]
      properties:
        business_id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string

    UpdateCustomerRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string

    CustomerListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Invoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        business_id:
          type: string
        customer_id:
          type: string
        invoice_no:
          type: string
        status:
          type: string
          enum: [draft, sent, partial, paid, overdue, cancelled]
        issue_date:
          type: string
          format: date-time
        due_date:
          type: string
          format: date-time
        subtotal:
          type: number
        tax_total:
          type: number
        total:
          type: number
        paid_amount:
          type: number
        pdf_url:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItem'

    InvoiceItem:
      type: object
      properties:
        id:
          type: string
        product_id:
          type: string
        description:
          type: string
        quantity:
          type: number
        unit_price:
          type: number
        tax_rate:
          type: number
        subtotal:
          type: number
        tax_amount:
          type: number
        total:
          type: number

    CreateInvoiceRequest:
      type: object
      required: [business_id, customer_id, due_date, items]
      properties:
        business_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        due_date:
          type: string
          format: date-time
        notes:
          type: string
        terms:
          type: string
        items:
          type: array
          items:
            type: object
            required: [description, quantity, unit_price]
            properties:
              product_id:
                type: string
              description:
                type: string
              quantity:
                type: number
              unit_price:
                type: number
              tax_rate:
                type: number

    UpdateInvoiceRequest:
      type: object
      properties:
        due_date:
          type: string
          format: date-time
        notes:
          type: string
        terms:
          type: string

    InvoiceListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        invoice_id:
          type: string
        business_id:
          type: string
        amount:
          type: number
        payment_method:
          type: string
        reference:
          type: string
        notes:
          type: string
        status:
          type: string

    CreatePaymentRequest:
      type: object
      required: [invoice_id, amount, payment_method]
      properties:
        invoice_id:
          type: string
          format: uuid
        amount:
          type: number
        payment_method:
          type: string
        reference:
          type: string
        notes:
          type: string

    UploadUrlResponse:
      type: object
      required: [upload_url, required_headers]
      properties:
        upload_url:
          type: string
        required_headers:
          type: object
          description: Headers that must be sent unchanged with the presigned PUT.
          required: [Content-Type, Content-Length]
          properties:
            Content-Type:
              type: string
            Content-Length:
              type: string

    EmailPayload:
      type: object
      properties:
        to:
          type: string
        subject:
          type: string
        body:
          type: string
        sent_at:
          type: string
          format: date-time
        message_id:
          type: string

security:
  - bearerAuth: []
