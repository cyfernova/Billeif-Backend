      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Price list details
    put:
      tags: [Billing Ops]
      summary: Update price list
      operationId: updatePriceList
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Price list updated
    delete:
      tags: [Billing Ops]
      summary: Delete price list
      operationId: deletePriceList
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Price list deleted

  /api/v1/price-lists/{id}/items:
    get:
      tags: [Billing Ops]
      summary: List price list items
