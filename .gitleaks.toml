[extend]
useDefault = true

[[allowlists]]
description = "Exact synthetic cleanup-error canary asserted by verifier tests"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^internal/verify/runner_test\.go$''']
regexTarget = "secret"
regexes = ['''^abcdef123456$''']

[[allowlists]]
description = "Exact synthetic API-key canary asserted by verifier redaction tests"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^internal/verify/redact_test\.go$''']
regexTarget = "secret"
regexes = ['''^sk-live-abc123$''']

[[allowlists]]
description = "Synthetic API-key fixtures used by configuration, Terraform, and voice tests"
paths = [
  '''^infrastructure/terraform/tests/http_serverless\.tftest\.hcl$''',
  '''^infrastructure/terraform/tests/razorpay\.tftest\.hcl$''',
  '''^internal/config/config_test\.go$''',
  '''^internal/config/invoice_cursor_test\.go$''',
  '''^internal/handlers/voice_session_handler_test\.go$''',
  '''^internal/providers/sarvam/client_test\.go$''',
  '''^internal/voice/protocol/testdata/v1/session-create\.json$''',
  '''^internal/voice/protocol/testdata/v1/successor-create\.json$''',
  '''^internal/voice/session/dynamodb_store_test\.go$''',
  '''^internal/voice/session/service_test\.go$''',
  '''^internal/voice/telemetry/redaction_test\.go$''',
]
